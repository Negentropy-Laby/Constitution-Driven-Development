# Recorded adapter comparison state; ordinary offline use needs no local checker.
# /constitute copies this deterministic template unchanged as uninitialized.
# /constitute-check reports installed-file observations and available live
# comparisons separately. Unavailable/invalid checks preserve this record.
# A Source-only result does not establish consumer installed-file freshness.
# Only valid evidence for the actual checked owner/inputs and scoped write
# authority can record fresh/stale digests, revision, time and actual check.
# /cdd-status reads historical values without recomputing or owning them.
# Empty values mean no recorded evidence; do not fabricate live state.

schema_version: 1
status: uninitialized            # uninitialized | fresh | stale
manifest_version: 2
manifest_digest: ""
source_digest: ""
checked_commit: ""
checked_at: ""
check_command: ""
